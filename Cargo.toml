[workspace]
members = [
    "crates/wasmc-diagnostics",
    "crates/wasmc-lexer",
    "crates/wasmc-ast",
    "crates/wasmc-parser",
    "crates/wasmc-semantics",
    "crates/wasmc-hir",
    "crates/wasmc-mir",
    "crates/wasmc-optimizer",
    "crates/wasmc-stackifier",
    "crates/wasmc-memory",
    "crates/wasmc-wasm",
    "crates/wasmc-bindings",
    "crates/wasmc-cache",
    "crates/wasmc-driver",
    "crates/wasmc-daemon",
    "crates/wasmc-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["wasmc compiler team"]
license = "Apache-2.0 OR MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
blake3 = { version = "1.5", default-features = false, features = ["pure"] }
rusqlite = { version = "0.33", features = ["bundled"] }
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.43", features = ["full"] }
axum = { version = "0.8" }
wasmparser = "0.225"
